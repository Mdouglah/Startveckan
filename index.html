:root{
  --bg:#f5f3ec; --ink:#123f37; --muted:#4f6b63; --surface:#ffffff;
  --line:rgba(18,63,55,0.14); --accent:#2f6b5a; --tint:#d7e2d7;
  --terra:#c9785f; --terra-text:#a4533c;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:72px;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
img,svg{max-width:100%;}
a{color:var(--accent);text-underline-offset:3px;}
a:hover{color:var(--ink);}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px;}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.12;margin:0;color:var(--ink);}
h1 em,h2 em{color:var(--terra-text);font-style:italic;}
h3{font-size:1.45rem;}
p{margin:0 0 .8em;}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
.muted{color:var(--muted);}
.small{font-size:.92rem;}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* Hero: stack + arc */
.hero{padding:44px 0 28px;}
.hero-arc{display:block;width:220px;height:auto;margin:0 0 18px -6px;}
.arc-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-out .2s forwards;}
.arc-dot{opacity:0;animation:appear 1.2s ease-out 1.5s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes appear{to{opacity:1;}}
.hero-for{color:var(--muted);font-size:1rem;margin:0 0 10px;}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.4rem);max-width:15ch;letter-spacing:-0.01em;}
.hero-lede{font-size:1.15rem;max-width:56ch;margin:18px 0 0;color:var(--ink);}

/* Stadieväljare */
.stage{padding:8px 0 26px;}
.stage-q{font-weight:500;margin:0 0 10px;}
.stage-btns{display:flex;flex-wrap:wrap;gap:10px;}
.stage-btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 20px;display:inline-flex;gap:8px;align-items:baseline;min-height:44px;}
.stage-btn span{color:var(--muted);font-size:.9rem;}
.stage-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
.stage-btn[aria-pressed="true"] span{color:var(--tint);}

/* Flikar */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.tabs-inner{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;max-width:1080px;margin:0 auto;scrollbar-width:thin;}
.tab{font:inherit;font-weight:500;font-size:.98rem;cursor:pointer;white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;min-height:42px;}
.tab:hover{border-color:var(--line);}
.tab[aria-current="page"]{background:var(--accent);color:#fff;}

/* Vyer */
main{padding:36px 0 56px;}
.view[hidden]{display:none;}
.view.entering{animation:fadein 1s ease-out;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.view-head{margin-bottom:26px;max-width:68ch;}
.view-head h2{font-size:clamp(2rem,4.4vw,2.9rem);margin-bottom:12px;}
.view-head h2:focus{outline:none;}
.view-head p{font-size:1.08rem;}
.section-title{font-size:1.75rem;margin:44px 0 14px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.pill{display:inline-block;font-size:.85rem;font-weight:500;padding:3px 12px;border-radius:999px;background:var(--tint);color:var(--ink);}
.btn{font:inherit;font-weight:500;cursor:pointer;border-radius:999px;padding:10px 20px;min-height:44px;border:1px solid var(--accent);background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn-ghost{background:transparent;color:var(--accent);}
